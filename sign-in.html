</style></head><body><div class="art" aria-hidden="true"></div><main class="left"><a class="logo" href="/" aria-label="Worksite Safety certification profile"><img src="/sign-in-reference.png" alt="Worksite Safety"></a><h1>Sign In</h1><form id="sign-in"><label for="username">Email / Username</label><input id="username" name="username" autocomplete="username" required><button type="submit">Continue</button></form><nav class="links" aria-label="Account options"><a href="#create-account" data-action="create">Create an account <span aria-hidden="true">›</span></a><a class="forgot" href="#forgot-password" data-action="reset">Forgot your password?</a></nav><div class="powered">Powered By <span class="qualify">Qualify</span></div></main><dialog id="notice"><h2>Account access</h2><p>This sign-in page is a visual preview. Sign-in, account creation, and password recovery are not connected yet. No account information has been sent or saved.</p><button id="close" type="button">Close</button></dialog><script>const notice=document.getElementById('notice');document.getElementById('sign-in').addEventListener('submit',e=>{e.preventDefault();document.getElementById('username').value='';notice.showModal()});document.querySelectorAll('[data-action]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();notice.showModal()}));document.getElementById('close').onclick=()=>notice.close();</script></body></html>
